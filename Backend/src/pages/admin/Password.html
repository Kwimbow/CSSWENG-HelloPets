<!DOCTYPE html>
<html>
    <head>
        <title>Hello Pets PH | Password</title>
        <link rel="icon" type="image/jpg" href="/Logos/Icon.png">
        <link rel="stylesheet" type="text/css" href="/css/Landing_Admin.css">
        <link rel="stylesheet" type="text/css" href="/css/Password_Admin.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <link href="https://fonts.googleapis.com/css2?family=Inder&family=Reddit+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

        <!-- fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet">

        <!-- script -->
         <script src="/js/admin_change_password.js" defer></script>
    </head>
    <body>
        <header>
            <div class="container">
                <div class="nav-bar">
                    <div class="logo">
                        <a href="/admin/view_bookings">
                            <img src="/Logos/Logo.png" alt="Hello Pets Logo" id="nav-icon">
                        </a>
                    </div>
                    <nav>
                        <ul class="nav-links">
                            <li><a href="/admin/view_bookings" class="nav-btns">ALL BOOKINGS</a></li>
                            <li><a href="/admin/manage_page" class="nav-btns">MANAGE PAGE</a></li>
                            <li><a href="/admin/pricing" class="nav-btns">EDIT PRICES</a></li>
                            <li><a href="/admin/password" class="nav-btns">CHANGE PASSWORD</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>
        <div class="scalloped-edge"></div>

        <div id="nav-space">
            
        </div>

        <div id="password-editor">
            <h2>Account</h2>
            <div class="pricing-group">
                <h3>Change Password</h3>
                <div class="password-form">
                    <div class="container">
                        <div class="side">
                            <label>Current Password
                                <input type="password" id="current-password" autocomplete="current-password">
                            </label>
                        </div>
                        <div class="side">
                            <label>New Password
                                <input type="password" id="new-password" autocomplete="new-password">
                            </label>
                            <label>Confirm New Password
                                <input type="password" id="confirm-new-password" autocomplete="new-password">
                            </label>
                        </div>
                    </div>
                    <p id="password-change-message" class="password-change-message"></p>
                    <span id="change-password-btn" class="password-save-btn">Update Password</span>
                </div>
            </div>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Hello Pets PH | Admin Log In</title>
        <link rel="icon" type="image/jpg" href="/Logos/Icon.png">
        <link rel="stylesheet" type="text/css" href="/css/Landing.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <link href="https://fonts.googleapis.com/css2?family=Inder&family=Reddit+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    <body>

        <div id="nav-space">
            
        </div>

        <h1>Admin Login</h1>
        <form method="POST">
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div>
                <button type="submit">Log In</button>
            </div>
        </form>

    </body>
</html>
